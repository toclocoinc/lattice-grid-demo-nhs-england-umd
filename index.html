<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>England's hospitals, month by month</title>
    <meta
      name="description"
      content="Every NHS trust's A&amp;E performance and elective waiting list, month by month, exactly as NHS England publishes them. Built with Lattice Grid loaded by script tag, with no install and no build."
    />
    <link rel="icon" href="data:," />
    <!--
      The grid's stylesheet, from jsDelivr. Every address on this page names
      the exact release, 1.88.1, and carries the hash of the file it expects,
      so the page can never quietly pick up a different build than the one it
      was checked against.
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.88.1/lattice-grid.min.css"
      integrity="sha384-txi7v3be5FyHXgVX7wUHyGKtrrlgUxHJevXiUJLYvfcM9Xodmuqj0Efv+QcA9TaM"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <div class="loading">
        <h1>England's hospitals, month by month</h1>
        <p class="loading-message">Starting...</p>
      </div>
    </main>

    <!--
      The library, as classic script tags. No npm install, no bundler, no
      `type="module"`: each file runs as it arrives and leaves a global behind.

        lattice-grid.min.js          LatticeGrid            the grid itself
        modules/charts.min.js        LatticeGrid.createChart  (extends the core, so it must follow it)
        modules/data-router.min.js   LatticeGridDataRouter
        modules/kpi.min.js           LatticeGridKPI
        modules/tabs.min.js          LatticeGridTabs

      The order matters once: the charts module folds itself into the core
      global rather than defining its own, so the core has to be there first.
      The other three are self-contained and could go in any order.
    -->
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.88.1/lattice-grid.min.js"
      integrity="sha384-l4Xv7k3AxKxV5vzSMvvTBra6zXRaI38FIozlST0A2/scl3pQji5rCtYl7YkJrd7h"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.88.1/modules/charts.min.js"
      integrity="sha384-TXeAMpr9PIjOVjUOa5oNikMsM289Vetd2Fjt4UQNO9lzvnXxjwUG0VPgk6I5EVbT"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.88.1/modules/data-router.min.js"
      integrity="sha384-49hE995Wq4LOLA59Hyhf10yI70AXnmbeVRcmVctFbWOGCbfIeC3WHJhjPQd0Z3mi"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.88.1/modules/kpi.min.js"
      integrity="sha384-NnBp9Lbu987V9/cZfem/EWfH0MbaldbM30RRPdohHcAJ06I+Z+t0W1PVilYmh88O"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.88.1/modules/tabs.min.js"
      integrity="sha384-rxAcxJmKjIrG+EnoyRiNQFon2DzcDnf6moAU4fFoWm2z/hBvyfiOKDfoS7vlQyF2"
      crossorigin="anonymous"
    ></script>

    <!-- The demo's own code, in the order each file needs the one before it. -->
    <script src="./src/licence.js"></script>
    <script src="./src/nhs-data.js"></script>
    <script src="./src/treatment.js"></script>
    <script src="./src/dashboard.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
